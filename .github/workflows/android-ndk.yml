name: android .so

# Кросс-сборка патченого движка под Android.
#
# Runtime при этом НЕ меняется: он заморожен на multi-region-runtime-v2, а сборка под другую
# платформу — это конфигурация. Ни один файл из src/, valhalla/ или wedrive/ здесь не правится.
#
# Долго это будет только в первый раз: vcpkg собирает protobuf, boost и abseil под чужую ABI из
# исходников. Дальше работает кэш.

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "ABI: arm64-v8a (машина), x86_64 (эмулятор) или both"
        required: false
        default: "arm64-v8a"
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-ndk.yml"

permissions:
  contents: read

# pipefail, иначе `cmake ... | tail` отдаёт код ВЫХОДА tail, а не cmake: шаг рапортует
# успехом поверх упавшей сборки. За эту сессию тот же класс ошибки сработал трижды —
# grep -c при нуле совпадений, docker -e VAR="" и вот конвейер.
defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            triplet: arm64-android
          - abi: x86_64
            triplet: x64-android
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: что собираем
        run: |
          echo "ABI: ${{ matrix.abi }}, triplet: ${{ matrix.triplet }}"
          echo "движок: $(git describe --tags --always)"
          df -h / | tail -1

      # API 31 — не произвольное число: это пол всего проекта, потому что головное устройство
      # Zeekr работает на Android 12. Собрать под что-то новее значит собрать то, что не
      # установится в машину.
      - name: NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          # r29, а не r26: Valhalla зовёт std::format_string в midgard/logging.h БЕЗ единой
          # проверки доступности, а в libc++ у r26 его ещё нет — сборка падает шестью
          # ошибками в первом же файле midgard. Версия взята не наугад: ровно на r29
          # собирает Valhalla под Android проект Rallista/valhalla-mobile, чей AAR это
          # приложение использует сегодня.
          ndk-version: r29

      # ПАТЧИ НАКЛАДЫВАЮТСЯ ЗДЕСЬ, и без этого шага собирается СТОКОВАЯ Valhalla.
      #
      # В репозитории лежат исходники upstream плюс wedrive/patch-*.py: multi-region существует
      # как набор патчей, применяемых при сборке, а не как изменённые файлы в истории. Образ
      # движка для фабрики карт это делает, а здесь я забыл — и собиралась стоковая библиотека.
      #
      # Поймалось это не на маршруте в машине, а на компиляции: функции-отпечатки в
      # wedrive_jni.cc зовут with_region и kWeDriveMaxRegions, которых у стоковой Valhalla нет.
      # Ради этого они и написаны.
      - name: патчи multi-region
        run: |
          bash wedrive/apply-patches.sh . | tail -25
          echo "--- проверка, что легли:"
          grep -c WEDRIVE valhalla/baldr/graphid.h valhalla/sif/edgelabel.h valhalla/baldr/graphreader.h

      - name: vcpkg
        run: |
          # БЕЗ --depth 1: vcpkg достаёт versions/baseline.json из ЗАФИКСИРОВАННОГО
          # коммита через `git show`, и в поверхностном клоне этого коммита нет.
          # Ошибка при этом выглядит как проблема с зависимостями, а не с клоном.
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: кэш зависимостей vcpkg
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('android/vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.triplet }}-

      - name: конфигурация
        run: |
          cmake -S android -B "build/${{ matrix.abi }}" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DVCPKG_OVERLAY_TRIPLETS="$PWD/android/triplets" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-31 \
            -DCMAKE_BUILD_TYPE=Release \
            2>&1 | tail -60

      # ГДЕ ЖИВЁТ thread_cache_ — вопрос, который стоил прогона, потому что задан не был.
      #
      # Линковка падала на ЕДИНСТВЕННОМ символе
      # `google::protobuf::internal::ThreadSafeArena::thread_cache_`. Первая гипотеза — что
      # зависимости собраны на уровне API ниже 29 и получили ЭМУЛИРОВАННЫЙ TLS
      # (`__emutls_v.<имя>` вместо прямого символа) — измерением ОПРОВЕРГНУТА: в libprotobuf.a
      # символа нет ни в прямой форме, ни в эмулированной. Значит он в другом архиве.
      #
      # Шаг СООБЩАЕТ, а не падает: иначе он блокирует сборку, которая могла бы пройти, и следующий
      # прогон снова ничего не измерит. Утверждает здесь только отсутствие символа ВЕЗДЕ.
      - name: где определён thread_cache_
        run: |
          NM="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          LIBDIR=$(dirname "$(find "build/${{ matrix.abi }}/vcpkg_installed" -name 'libprotobuf.a' | head -1)")
          echo "   каталог: $LIBDIR"
          found=0
          for a in "$LIBDIR"/*.a; do
            syms=$("$NM" --defined-only "$a" 2>/dev/null || true)
            d=$(printf '%s\n' "$syms" | grep -c 'ThreadSafeArena12thread_cache_' || true)
            e=$(printf '%s\n' "$syms" | grep -c '__emutls_v.*thread_cache_' || true)
            if [ "$d" != "0" ] || [ "$e" != "0" ]; then
              echo "   ОПРЕДЕЛЁН в $(basename "$a"): прямой $d, эмулированный $e"
              found=1
            fi
          done
          echo "   --- архивы protobuf в каталоге:"
          ls -1 "$LIBDIR" | grep -i protobuf | sed 's/^/     /' || true
          if [ "$found" = "0" ]; then
            echo "!! thread_cache_ не определён НИ В ОДНОМ архиве — дело не в порядке линковки"
            exit 1
          fi

      - name: сборка
        run: cmake --build "build/${{ matrix.abi }}" -j"$(nproc)" 2>&1 | tail -80

      # Библиотека обязана отвечать, ЧТО в ней собрано: патченый движок снаружи неотличим от
      # стокового до первого маршрута через границу, и приложение, положившее не тот .so, узнает
      # об этом в машине.
      #
      # Проверка УТВЕРЖДАЕТ, а не сообщает. Прежняя версия писала «НЕТ НАШИХ СИМВОЛОВ» и
      # завершалась успехом — то есть пустая библиотека уехала бы артефактом, и отказ вскрылся бы
      # на устройстве, где причина уже не видна.
      - name: что внутри .so
        run: |
          NM="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          SO=$(find "build/${{ matrix.abi }}" -name 'libwedrive_valhalla.so' | head -1)
          [ -n "$SO" ] || { echo "!! библиотека не собралась"; exit 1; }
          ls -la "$SO"
          file "$SO" || true
          syms=$("$NM" -D --defined-only "$SO" || true)
          ours=$(printf '%s\n' "$syms" | grep -c 'wedrive_' || true)
          jni=$(printf '%s\n' "$syms" | grep -c 'Java_com_wedrive_data_NativeValhalla' || true)
          eng=$(printf '%s\n' "$syms" | grep -c 'valhalla' || true)
          echo "   наших символов: $ours, точек JNI: $jni, символов движка: $eng"
          printf '%s\n' "$syms" | grep 'wedrive_max_regions\|wedrive_self_test' | sed 's/^/     /' || true
          [ "$ours" -gt 0 ] || { echo "!! в библиотеке нет наших символов"; exit 1; }
          # Семь внешних методов NativeValhalla.kt — меньше значит, что часть не экспортирована и
          # приложение упадёт на UnsatisfiedLinkError уже после загрузки библиотеки.
          [ "$jni" -ge 7 ] || { echo "!! точек JNI $jni, ожидалось 7"; exit 1; }
          [ "$eng" -gt 100 ] || { echo "!! символов движка $eng — библиотека пустая"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: wedrive-valhalla-${{ matrix.abi }}
          path: build/${{ matrix.abi }}/**/libwedrive_valhalla.so
          if-no-files-found: error
